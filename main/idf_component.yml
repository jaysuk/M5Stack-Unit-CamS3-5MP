## IDF Component Manager Manifest
## Managed components required for IDF 6.0+ (removed from built-in set in v6).
## Rules gate each dependency so they are only resolved on IDF 6+ — on IDF 5.x
## the built-in mqtt/json components are used instead. Wi-Fi provisioning is our own
## wifi_provision component (esp_wifi/esp_netif/esp_http_server only), so it needs no
## managed dependency on either IDF version.
dependencies:
  espressif/mqtt:
    version: "^1.0.0"
    rules:
      - if: "idf_version >=6.0"
  espressif/cjson:
    version: "^1.7.19"
    rules:
      - if: "idf_version >=6.0"
  espressif/mdns:
    version: ">=1.3.0"
  espressif/led_strip:
    version: "^3.0.1"
  idf:
    version: ">=5.3"
