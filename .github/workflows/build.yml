name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # Regression check only, on every push/PR — does NOT publish to releases.
  # PY260 (M5Stack Unit CamS3-5MP) is still the documented/default board via
  # sdkconfig.defaults, so this is what verifies the primary hardware target
  # still builds on every change. See release-py260/release-ov3660 below for
  # the boards that actually get tagged and released.
  build-v5:
    name: IDF v5.3.2 / esp32s3 (PY260)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: "."
          command: idf.py build

  # Builds the PY260 board variant (sdkconfig.defaults, no override) and publishes it to the
  # GitHub Release. Tag-triggered only -- build-v5 above already covers this board as a
  # regression check on every push/PR. Every uploaded asset is prefixed unitcams3_py260_ so it
  # can't collide with release-ov3660's assets in the same release.
  release-py260:
    name: Release / PY260 (IDF v5.3.2)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write       # needed to upload release assets
      id-token:  write      # needed for provenance attestation
      attestations: write   # needed for provenance attestation -- id-token alone 403s with
                             # "Resource not accessible by integration" against the attestations API

    steps:
      - uses: actions/checkout@v4

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: "."
          command: idf.py build

      # Merge all flash regions into one file — simpler for users doing a first flash — and
      # copy the individual regions out under board-prefixed names too, for users flashing with
      # a GUI tool that wants the parts separately. build/ is owned by the Docker container from
      # the previous step and is not writable here, so everything gets written to workspace root.
      # Offsets match partition-table.csv (bootloader 0x0, pt 0x8000, otadata 0x11000, app 0x20000).
      - name: Prepare release assets
        run: |
          pip install esptool --quiet
          esptool --chip esp32s3 merge-bin \
            --output unitcams3_py260_merged.bin \
            0x0      build/bootloader/bootloader.bin \
            0x8000   build/partition_table/partition-table.bin \
            0x11000  build/ota_data_initial.bin \
            0x20000  build/unitcams3_firmware.bin
          cp build/unitcams3_firmware.bin           unitcams3_py260_firmware.bin
          cp build/bootloader/bootloader.bin         unitcams3_py260_bootloader.bin
          cp build/partition_table/partition-table.bin unitcams3_py260_partition-table.bin
          cp build/ota_data_initial.bin              unitcams3_py260_ota_data_initial.bin

      # Attest provenance for the merged binary.
      # Creates a signed SLSA statement on GitHub's transparency log.
      # Verify with: gh attestation verify unitcams3_py260_merged.bin --repo hbentel/M5Stack-Unit-CamS3-5MP
      # Attestation requires a public repo or GitHub Advanced Security.
      # continue-on-error so the build stays green on private forks or forks
      # without the id-token:write permission.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        id: attest
        continue-on-error: true
        with:
          subject-path: unitcams3_py260_merged.bin

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            unitcams3_py260_merged.bin
            unitcams3_py260_firmware.bin
            unitcams3_py260_bootloader.bin
            unitcams3_py260_partition-table.bin
            unitcams3_py260_ota_data_initial.bin

  # Builds the OV3660 board variant (sdkconfig.defaults + sdkconfig.ov3660) and
  # publishes it to the GitHub Release. Tag-triggered only — this board is new
  # enough that it isn't worth a full build on every push/PR yet, just on release.
  # Every uploaded asset is prefixed unitcams3_ov3660_ so it can't collide with
  # release-py260's assets in the same release.
  release-ov3660:
    name: Release / OV3660 (IDF v5.3.2)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write       # needed to upload release assets
      id-token:  write      # needed for provenance attestation
      attestations: write   # needed for provenance attestation -- id-token alone 403s with
                             # "Resource not accessible by integration" against the attestations API

    steps:
      - uses: actions/checkout@v4

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: "."
          command: |
            export SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ov3660"
            idf.py build

      # Merge all flash regions into one file — simpler for users doing a first flash — and
      # copy the individual regions out under board-prefixed names too, for users flashing with
      # a GUI tool that wants the parts separately. build/ is owned by the Docker container from
      # the previous step and is not writable here, so everything gets written to workspace root.
      # Offsets match partition-table.csv (bootloader 0x0, pt 0x8000, otadata 0x11000, app 0x20000).
      - name: Prepare release assets
        run: |
          pip install esptool --quiet
          esptool --chip esp32s3 merge-bin \
            --output unitcams3_ov3660_merged.bin \
            0x0      build/bootloader/bootloader.bin \
            0x8000   build/partition_table/partition-table.bin \
            0x11000  build/ota_data_initial.bin \
            0x20000  build/unitcams3_firmware.bin
          cp build/unitcams3_firmware.bin           unitcams3_ov3660_firmware.bin
          cp build/bootloader/bootloader.bin         unitcams3_ov3660_bootloader.bin
          cp build/partition_table/partition-table.bin unitcams3_ov3660_partition-table.bin
          cp build/ota_data_initial.bin              unitcams3_ov3660_ota_data_initial.bin

      # Attest provenance for the merged binary.
      # Creates a signed SLSA statement on GitHub's transparency log.
      # Verify with: gh attestation verify unitcams3_ov3660_merged.bin --repo hbentel/M5Stack-Unit-CamS3-5MP
      # Attestation requires a public repo or GitHub Advanced Security.
      # continue-on-error so the build stays green on private forks or forks
      # without the id-token:write permission.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        id: attest
        continue-on-error: true
        with:
          subject-path: unitcams3_ov3660_merged.bin

      - name: Upload firmware to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            unitcams3_ov3660_merged.bin
            unitcams3_ov3660_firmware.bin
            unitcams3_ov3660_bootloader.bin
            unitcams3_ov3660_partition-table.bin
            unitcams3_ov3660_ota_data_initial.bin

  build-v6:
    name: IDF v6.0 / esp32s3
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v6.0
          target: esp32s3
          path: "."
          command: idf.py build
